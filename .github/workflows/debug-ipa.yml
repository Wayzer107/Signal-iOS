name: Debug IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      app_group:
        description: "App Group ID to build against, e.g. group.abc123.1. Must be one your signing profile actually grants, or the app crashes on launch. Leave empty for the project default."
        required: false
        default: ""
      app_group_staging:
        description: "Staging App Group ID. Leave empty for the project default."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # Path format pulled from https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#xcode
  DEVELOPER_DIR: /Applications/Xcode_26.6.app

permissions:
  contents: write

jobs:
  build_debug_ipa:
    name: Build Debug IPA
    timeout-minutes: 120
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v6

      - name: Check Xcode version
        run: |
          Scripts/check_xcode_version.py --relaxed

      - name: Download Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Download iOS platform
        run: |
          xcodebuild -downloadPlatform iOS

      - uses: ./.github/actions/clone-everything
        with:
          access-token: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1 # Reads .ruby-version file by default
        with:
          bundler-cache: true

      - name: Build unsigned Debug archive
        env:
          APP_GROUP: ${{ inputs.app_group }}
          APP_GROUP_STAGING: ${{ inputs.app_group_staging }}
        run: |
          set -o pipefail
          OVERRIDES=()
          if [ -n "$APP_GROUP" ]; then
            OVERRIDES+=("SIGNAL_APP_GROUP=$APP_GROUP")
          fi
          if [ -n "$APP_GROUP_STAGING" ]; then
            OVERRIDES+=("SIGNAL_APP_GROUP_STAGING=$APP_GROUP_STAGING")
          fi
          echo "Build setting overrides: ${OVERRIDES[*]:-(none, using project defaults)}"
          xcodebuild archive \
            -workspace Signal.xcworkspace \
            -scheme Signal \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Signal.xcarchive" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            "${OVERRIDES[@]}" \
            2>&1 \
            | tee "$RUNNER_TEMP/archive.log" \
            | xcbeautify --renderer github-actions --disable-logging

      - name: Package unsigned IPA
        id: package
        run: |
          set -eo pipefail
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$RUNNER_TEMP/Signal.xcarchive/Products/Applications/Signal.app" "$PAYLOAD_DIR/"

          SHORT_SHA="$(git rev-parse --short HEAD)"
          IPA_NAME="Signal-debug-${SHORT_SHA}.ipa"
          (cd "$RUNNER_TEMP" && zip -r -y -q "$GITHUB_WORKSPACE/$IPA_NAME" Payload)

          APP_GROUP_USED="$(/usr/libexec/PlistBuddy -c 'Print :OWSApplicationGroupIdentifier' \
            "$PAYLOAD_DIR/Signal.app/Info.plist")"
          echo "app_group_used=$APP_GROUP_USED" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: debug-build-${{ github.run_number }}-${{ github.run_attempt }}
          IPA_NAME: ${{ steps.package.outputs.ipa_name }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
          APP_GROUP_USED: ${{ steps.package.outputs.app_group_used }}
        run: |
          set -eo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n\n' "Automated **unsigned, debug-configuration** build from commit ${GITHUB_SHA}."
            printf '%s\n' "⚠️ **Not code-signed.** This IPA has \`CODE_SIGNING_ALLOWED=NO\` and will not install"
            printf '%s\n' "as-is on a normal iPhone. Resign it yourself (e.g. with Sideloadly/AltStore using a"
            printf '%s\n\n' "free Apple ID) or install it on a jailbroken/TrollStore device."
            printf '%s\n' "⚠️ **Exposes internal debug tooling**, including *Settings → Internal → Export"
            printf '%s\n' "Database*, which shares your local (still-encrypted) database file and then copies"
            printf '%s\n' "its decryption key to the clipboard. Only install this build on a device/account you control for testing"
            printf '%s\n' "purposes — never use it with an account containing data you're not willing to expose."
            printf '\n%s\n' "App Group required by this build: \`${APP_GROUP_USED}\`. Whatever you resign this"
            printf '%s\n' "with must grant that exact App Group, or it will crash on launch."
          } > "$NOTES_FILE"

          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Debug build ${{ github.run_number }} ($SHORT_SHA)" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            "$IPA_NAME"

      - name: Upload build logs
        uses: actions/upload-artifact@v6
        if: failure() || cancelled()
        with:
          name: Debug IPA Logs
          path: ${{ runner.temp }}/archive.log
